name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Daily nightly full native build check (03:15 EST / 08:15 UTC)
    - cron: "15 8 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Native Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          diff_files=""
          if [ -n "$BASE_REF" ]; then
            git fetch origin "$BASE_REF"
            diff_files="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          elif [ -n "$PUSH_BEFORE" ] && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]] && git merge-base --is-ancestor "$PUSH_BEFORE" HEAD 2>/dev/null; then
            diff_files="$(git diff --name-only "$PUSH_BEFORE...HEAD")"
          else
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "ios=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          android=false
          ios=false
          shared_native_re='^(package\.json|package-lock\.json|react-native\.config\.js|app\.json|firebase\.json|babel\.config\.js|metro\.config\.js|\.github/workflows/ci\.yml)$'
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [[ "$file" =~ ^android/ ]] || [[ "$file" =~ ^scripts/.*android ]] || [[ "$file" =~ $shared_native_re ]]; then
              android=true
            fi
            if [[ "$file" =~ ^ios/ ]] || [[ "$file" =~ ^scripts/.*ios ]] || [[ "$file" =~ $shared_native_re ]]; then
              ios=true
            fi
          done <<< "$diff_files"

          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          echo "Detected native build triggers: android=$android, ios=$ios"

  jest:
    name: Jest & Dependency Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency lockfile consistency
        run: npm run verify:dependencies

      - name: Run full Jest suite and baseline gate
        run: node scripts/jest-gate.js

  android-release:
    name: Android Release APK
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci

      - name: Build Android Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          for attempt in 1 2; do
            ./gradlew assembleRelease --no-daemon \
              -PreactNativeArchitectures=arm64-v8a,x86_64 && break
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            echo "Gradle build failed on attempt $attempt; retrying in 15s..."
            sleep 15
          done

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: pxviewr-android-release-apk
          path: |
            android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
            android/app/build/outputs/apk/release/app-universal-release.apk
          if-no-files-found: error

  ios-simulator:
    name: iOS Simulator Build
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Install CocoaPods dependencies
        working-directory: ios
        env:
          LANG: en_US.UTF-8
        run: pod install

      - name: Build iOS Simulator app (unsigned Release)
        working-directory: ios
        env:
          LANG: en_US.UTF-8
        run: |
          xcodebuild \
            -workspace PxViewR.xcworkspace \
            -scheme PxViewR \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
