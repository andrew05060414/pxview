name: Android Release APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 14
        uses: actions/setup-node@v4
        with:
          node-version: 14.21.3

      # lockfileVersion 3 requires npm 9+; npm 9 still supports Node 14.21.
      - name: Upgrade npm for lockfile v3
        run: npm install -g npm@9

      - name: Install JS dependencies
        run: npm ci

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Run tests
        run: npx jest

      - name: Bundle JS
        run: sh ./scripts/bundle-android-release.sh

      # google-services.json is gitignored locally; a placeholder with the
      # right package name is enough for the google-services plugin at build
      # time (same approach as the retired copilot cloud-build branch).
      - name: Create placeholder google-services.json
        run: |
          cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "pxview-ci-placeholder",
              "storage_bucket": "pxview-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:1234567890abcdef1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.utopia.pxviewr"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyA12345678901234567890123456789012"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          # clean runs in its own invocation; see pxview-build skill pitfall
          ./gradlew clean --no-daemon
          ./gradlew assembleRelease --no-daemon \
            -x bundleReleaseJsAndAssets \
            "-PPXVIEWR_RELEASE_STORE_FILE=$PWD/app/debug.keystore" \
            "-PPXVIEWR_RELEASE_STORE_PASSWORD=android" \
            "-PPXVIEWR_RELEASE_KEY_ALIAS=androiddebugkey" \
            "-PPXVIEWR_RELEASE_KEY_PASSWORD=android"

      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk

      - name: Upload APK artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
