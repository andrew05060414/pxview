name: Android Release APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Verify dependency tree
        run: npm run verify:dependencies

      - name: Run Jest gate
        run: node scripts/jest-gate.js

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: 'gradle'

      - name: Build universal release APK (all 4 ABIs)
        working-directory: android
        run: |
          chmod +x gradlew
          for attempt in 1 2; do
            ./gradlew assembleRelease --no-daemon \
              "-PPXVIEWR_RELEASE_STORE_FILE=$PWD/app/debug.keystore" \
              "-PPXVIEWR_RELEASE_STORE_PASSWORD=android" \
              "-PPXVIEWR_RELEASE_KEY_ALIAS=androiddebugkey" \
              "-PPXVIEWR_RELEASE_KEY_PASSWORD=android" && break
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            echo "Gradle build failed on attempt $attempt; retrying in 15s..."
            sleep 15
          done

      - name: Verify APK ABI coverage (32-bit and 64-bit)
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            unzip -l "$APK" | grep -q "lib/$abi/" || { echo "Missing ABI $abi in $APK"; exit 1; }
          done

      - name: Rename APK
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            SUFFIX="$GITHUB_REF_NAME"
          else
            SUFFIX="$(git rev-parse --short HEAD)"
          fi
          mv android/app/build/outputs/apk/release/app-release.apk \
            "android/app/build/outputs/apk/release/PxViewR-$SUFFIX.apk"
          ls -la android/app/build/outputs/apk/release/

      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk

      - name: Upload APK artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: pxviewr-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
