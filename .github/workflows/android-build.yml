name: Android Build

on:
  push:
    branches:
      - master
      - main
      - 'claude/**'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '8'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '14.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Create dummy google-services.json
        run: |
          cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "123456789",
              "project_id": "pxview-dummy",
              "storage_bucket": "pxview-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789:android:abc123def456",
                  "android_client_info": {
                    "package_name": "com.utopia.pxviewr"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummy-Key-For-Build-Only"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Clean Gradle
        run: cd android && ./gradlew clean

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease --stacktrace --no-daemon
        continue-on-error: true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
        continue-on-error: true

      - name: Upload build outputs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-outputs
          path: |
            android/app/build/outputs/
            android/build/outputs/
        continue-on-error: true
