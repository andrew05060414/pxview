version: '3.8'

services:
  android-builder:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Mount output directory to get the APK
      - ./build-output:/app/android/app/build/outputs/apk
    environment:
      - NODE_ENV=production
    command: >
      bash -c "cd android &&
               ./gradlew clean &&
               ./gradlew assembleDebug &&
               echo 'Build complete! Check ./build-output directory for APK'"
