apply plugin: 'com.android.library'

def getExtValue(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def _buildToolsVersion = getExtValue('buildToolsVersion', '29.0.2')
def _compileSdkVersion = getExtValue('compileSdkVersion', 29)
def _targetSdkVersion = getExtValue('targetSdkVersion', 29)
def _minSdkVersion = getExtValue('minSdkVersion', 16)

android {
    buildToolsVersion _buildToolsVersion
    compileSdkVersion _compileSdkVersion

    defaultConfig {
        minSdkVersion _minSdkVersion
        targetSdkVersion _targetSdkVersion
        consumerProguardFiles 'proguard-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lintOptions {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly 'androidx.annotation:annotation:1.2.0'
    compileOnly 'androidx.core:core:1.6.0'
    compileOnly 'com.facebook.fresco:fresco:2.0.0'
}
