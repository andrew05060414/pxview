apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

import groovy.json.JsonSlurper

def googleServicesFile = file("google-services.json")
def hasRealGoogleServices = false
if (googleServicesFile.exists()) {
    try {
        def gsJson = new JsonSlurper().parseText(googleServicesFile.getText("UTF-8"))
        def projectId = gsJson?.project_info?.project_id?.toString()?.trim() ?: ""
        hasRealGoogleServices =
            projectId.length() > 0 &&
            !(projectId.toLowerCase() =~ /(placeholder|dummy|example|changeme|your[-_]?project|^ci[-_]|[-_]ci$)/)
    } catch (Exception ignored) {
        hasRealGoogleServices = false
    }
}

react {
    /* Autolinking */
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.utopia.pxviewr"
    defaultConfig {
        applicationId "com.utopia.pxviewr"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 600
        versionName "6.0.0"
        manifestPlaceholders = [
            firebaseAnalyticsDeactivated: hasRealGoogleServices ? "false" : "true",
            firebaseCrashlyticsCollectionEnabled: hasRealGoogleServices ? "true" : "false",
            firebasePerformanceCollectionEnabled: hasRealGoogleServices ? "true" : "false",
        ]
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def releaseStoreFile = findProperty('PXVIEWR_RELEASE_STORE_FILE') ?: 'debug.keystore'
            storeFile file(releaseStoreFile)
            storePassword(findProperty('PXVIEWR_RELEASE_STORE_PASSWORD') ?: 'android')
            keyAlias(findProperty('PXVIEWR_RELEASE_KEY_ALIAS') ?: 'androiddebugkey')
            keyPassword(findProperty('PXVIEWR_RELEASE_KEY_PASSWORD') ?: 'android')
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

if (googleServicesFile.exists()) {
    apply plugin: "com.google.gms.google-services"
    apply plugin: "com.google.firebase.crashlytics"
    android {
        buildTypes {
            debug {
                firebaseCrashlytics {
                    mappingFileUploadEnabled false
                }
            }
            release {
                firebaseCrashlytics {
                    mappingFileUploadEnabled false
                }
            }
        }
    }
}
